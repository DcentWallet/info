name: master

on:
  push:
    branches:
      - master    # master 브랜치에서 push 이벤트가 일어났을 때 실행

jobs:
  build:
    runs-on: ubuntu-22.04
    # AWS는 장기 액세스 키 대신 OIDC 역할로 접근한다. 역할은 이 레포 master push에서만 쓸 수 있다
    permissions:
      contents: read    # Checkout
      id-token: write   # AWS OIDC
    steps:
      - name: Checkout source code
        uses: actions/checkout@master

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # 이 레포 master push에서만 assume할 수 있는 역할이라 ARN은 비밀값이 아니다
          role-to-assume: arn:aws:iam::564714665430:role/github-actions-dcent-info
          aws-region: ap-northeast-2

      - name: Deploy
        run: |
          aws s3 sync \
            . s3://dcentwallet-info \
            --exclude ".git/*" \
            --region ap-northeast-2 \
            --delete
      - name: CloudFront Cache clear
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CF_DISTRIBUTION_ID }} --paths "/*"
